services:
  app:
    build: .
    container_name: ai_project_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MESSAGE_DATABASE_URL: ${MESSAGE_DATABASE_URL:-/app/data/dialogs.sqlite3}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - db
    dns:
      - 1.1.1.1
      - 8.8.8.8

  builder-lab:
    profiles:
      - builder-lab
    build:
      context: .
      dockerfile: Dockerfile.builder-lab
    container_name: ai_project_builder_lab
    restart: "no"
    init: true
    shm_size: 1gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_AI_NATIVE_BASE_URL: ${GOOGLE_AI_NATIVE_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_BUILDER_MODEL: ${GEMINI_BUILDER_MODEL:-gemini-3.6-flash}
      GEMINI_BUILDER_THINKING_LEVEL: ${GEMINI_BUILDER_THINKING_LEVEL:-high}
      GEMINI_BUILDER_TEMPERATURE: ${GEMINI_BUILDER_TEMPERATURE:-0.9}
      GEMINI_BUILDER_MAX_REPAIRS: ${GEMINI_BUILDER_MAX_REPAIRS:-3}
      GEMINI_VISUAL_CRITIC_MODEL: ${GEMINI_VISUAL_CRITIC_MODEL:-gemini-3.5-flash}
      GEMINI_VISUAL_CRITIC_THINKING_LEVEL: ${GEMINI_VISUAL_CRITIC_THINKING_LEVEL:-high}
      GEMINI_VISUAL_CRITIC_TIMEOUT_SECONDS: ${GEMINI_VISUAL_CRITIC_TIMEOUT_SECONDS:-60}
      GEMINI_REFERENCE_ANALYZER_MODEL: ${GEMINI_REFERENCE_ANALYZER_MODEL:-gemini-3.5-flash}
      GEMINI_REFERENCE_ANALYZER_THINKING_LEVEL: ${GEMINI_REFERENCE_ANALYZER_THINKING_LEVEL:-high}
      KAIGO_BROWSER_AUDIT_TIMEOUT_MS: ${KAIGO_BROWSER_AUDIT_TIMEOUT_MS:-10000}
      KAIGO_BROWSER_AUDIT_TOTAL_TIMEOUT_SECONDS: ${KAIGO_BROWSER_AUDIT_TOTAL_TIMEOUT_SECONDS:-120}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
      GEMINI_CHAT_THINKING_LEVEL: ${GEMINI_CHAT_THINKING_LEVEL:-medium}
      GEMINI_CHAT_TIMEOUT_SECONDS: ${GEMINI_CHAT_TIMEOUT_SECONDS:-45}
      KAIGO_CHAT_SESSION_SECRET: ${KAIGO_CHAT_SESSION_SECRET:-}
      KAIGO_CHAT_SESSION_TTL_SECONDS: ${KAIGO_CHAT_SESSION_TTL_SECONDS:-3600}
      KAIGO_CHAT_MAX_SESSIONS: ${KAIGO_CHAT_MAX_SESSIONS:-500}
      KAIGO_CHAT_RATE_LIMIT_REQUESTS: ${KAIGO_CHAT_RATE_LIMIT_REQUESTS:-12}
      KAIGO_CHAT_IP_RATE_LIMIT_REQUESTS: ${KAIGO_CHAT_IP_RATE_LIMIT_REQUESTS:-60}
      KAIGO_CHAT_RATE_LIMIT_WINDOW_SECONDS: ${KAIGO_CHAT_RATE_LIMIT_WINDOW_SECONDS:-60}
      KAIGO_CHAT_MAX_REQUESTS_PER_SESSION: ${KAIGO_CHAT_MAX_REQUESTS_PER_SESSION:-40}
      KAIGO_CHAT_GLOBAL_CONCURRENCY: ${KAIGO_CHAT_GLOBAL_CONCURRENCY:-4}
      KAIGO_CHAT_SECURE_COOKIE: ${KAIGO_CHAT_SECURE_COOKIE:-true}
      KAIGO_BUILDER_DEFAULT_ENGINE: ${KAIGO_BUILDER_DEFAULT_ENGINE:-direct}
      GEMINI_ANTIGRAVITY_AGENT: ${GEMINI_ANTIGRAVITY_AGENT:-antigravity-preview-05-2026}
      GEMINI_ANTIGRAVITY_TIMEOUT_SECONDS: ${GEMINI_ANTIGRAVITY_TIMEOUT_SECONDS:-900}
      GEMINI_ANTIGRAVITY_MAX_SNAPSHOT_BYTES: ${GEMINI_ANTIGRAVITY_MAX_SNAPSHOT_BYTES:-10485760}
      GEMINI_ANTIGRAVITY_MAX_TOTAL_TOKENS: ${GEMINI_ANTIGRAVITY_MAX_TOTAL_TOKENS:-500000}
      KAIGO_BUILDER_ENABLE_ANTIGRAVITY: ${KAIGO_BUILDER_ENABLE_ANTIGRAVITY:-true}
      KAIGO_BUILDER_RUN_TTL_SECONDS: ${KAIGO_BUILDER_RUN_TTL_SECONDS:-3600}
      KAIGO_BUILDER_MAX_RUNS: ${KAIGO_BUILDER_MAX_RUNS:-100}
      KAIGO_BUILDER_LAB_HOST: 0.0.0.0
      KAIGO_BUILDER_LAB_PORT: 8091
      KAIGO_BUILDER_LAB_ALLOW_REMOTE: "true"
      KAIGO_BUILDER_DEMO_PATH: /app/data/builder-demo/latest.json
    command: ["python", "scripts/run_builder_lab.py"]
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ./data/builder-demo:/app/data/builder-demo
    networks:
      - kaigo_builder_research
    dns:
      - 1.1.1.1
      - 8.8.8.8

  db:
    image: postgres:15-alpine
    container_name: ai_project_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  kaigo_builder_research:
    name: kaigo_builder_research
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-kaigo-build
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.240.0/28
