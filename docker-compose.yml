services:
  app:
    build: .
    image: ${KAIGO_APP_IMAGE:-ai_project-app:local}
    container_name: ai_project_app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      KAIGO_ENVIRONMENT: production
      MESSAGE_DATABASE_URL: ${MESSAGE_DATABASE_URL:-/app/data/dialogs.sqlite3}
      KAIGO_RELEASE_ID: ${KAIGO_RELEASE_ID:-}
      KAIGO_BUILDER_WORKER_IMAGE_IDENTITY: ${KAIGO_BUILDER_WORKER_IMAGE_IDENTITY:-}
      KAIGO_BUILDER_WORKER_BOOT_ID: ${KAIGO_BUILDER_WORKER_BOOT_ID:-}
      KAIGO_READINESS_TOKEN: ${KAIGO_READINESS_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - db
    networks:
      kaigo_app_public:
        gw_priority: 1
      kaigo_app_db:
    dns:
      - 1.1.1.1
      - 8.8.8.8

  builder-worker:
    profiles:
      - saas-worker
    build:
      context: .
      dockerfile: Dockerfile.builder-lab
    image: ${KAIGO_BUILDER_WORKER_IMAGE:-ai_project-builder-worker:local}
    container_name: ai_project_builder_worker
    restart: "no"
    init: true
    read_only: true
    shm_size: 1gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      KAIGO_ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://widget_admin:change-me@db:5432/widget_platform}
      KAIGO_BUILDER_STAGE_HANDLER: ${KAIGO_BUILDER_STAGE_HANDLER:-builtin:orchestrator}
      KAIGO_BUILDER_LEASE_SECONDS: ${KAIGO_BUILDER_LEASE_SECONDS:-90}
      KAIGO_BUILDER_HEARTBEAT_SECONDS: ${KAIGO_BUILDER_HEARTBEAT_SECONDS:-20}
      KAIGO_BUILDER_POLL_SECONDS: ${KAIGO_BUILDER_POLL_SECONDS:-0.5}
      KAIGO_BUILDER_WORKER_BOOT_ID: ${KAIGO_BUILDER_WORKER_BOOT_ID:-}
      KAIGO_RELEASE_ID: ${KAIGO_RELEASE_ID:-}
      KAIGO_BUILDER_WORKER_IMAGE_IDENTITY: ${KAIGO_BUILDER_WORKER_IMAGE_IDENTITY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_AI_NATIVE_BASE_URL: ${GOOGLE_AI_NATIVE_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_BUILDER_MODEL: ${GEMINI_BUILDER_MODEL:-gemini-3.6-flash}
      GEMINI_BUILDER_THINKING_LEVEL: ${GEMINI_BUILDER_THINKING_LEVEL:-high}
      GEMINI_BUILDER_TEMPERATURE: ${GEMINI_BUILDER_TEMPERATURE:-0.9}
      GEMINI_BUILDER_MAX_REPAIRS: ${GEMINI_BUILDER_MAX_REPAIRS:-3}
      KAIGO_BUILDER_HYBRID_ROUTING_ENABLED: ${KAIGO_BUILDER_HYBRID_ROUTING_ENABLED:-false}
      AGENTROUTER_API_KEY: ${AGENTROUTER_API_KEY:-}
      AGENTROUTER_BASE_URL: ${AGENTROUTER_BASE_URL:-https://agentrouter.org/v1}
      AGENTROUTER_TIMEOUT_SECONDS: ${AGENTROUTER_TIMEOUT_SECONDS:-180}
      AGENTROUTER_QWEN_EXECUTABLE: ${AGENTROUTER_QWEN_EXECUTABLE:-/usr/local/bin/qwen}
      AGENTROUTER_GPT_MODEL: ${AGENTROUTER_GPT_MODEL:-gpt-5.5}
      AGENTROUTER_GLM_MODEL: ${AGENTROUTER_GLM_MODEL:-glm-5.2}
      AGENTROUTER_GPT_INPUT_PRICE_MICROUSD_PER_MILLION: ${AGENTROUTER_GPT_INPUT_PRICE_MICROUSD_PER_MILLION:-7000000}
      AGENTROUTER_GPT_OUTPUT_PRICE_MICROUSD_PER_MILLION: ${AGENTROUTER_GPT_OUTPUT_PRICE_MICROUSD_PER_MILLION:-7000000}
      AGENTROUTER_GLM_INPUT_PRICE_MICROUSD_PER_MILLION: ${AGENTROUTER_GLM_INPUT_PRICE_MICROUSD_PER_MILLION:-6000000}
      AGENTROUTER_GLM_OUTPUT_PRICE_MICROUSD_PER_MILLION: ${AGENTROUTER_GLM_OUTPUT_PRICE_MICROUSD_PER_MILLION:-6000000}
      GEMINI_VISUAL_CRITIC_MODEL: ${GEMINI_VISUAL_CRITIC_MODEL:-gemini-3.6-flash}
      GEMINI_VISUAL_CRITIC_THINKING_LEVEL: ${GEMINI_VISUAL_CRITIC_THINKING_LEVEL:-high}
      GEMINI_VISUAL_CRITIC_TIMEOUT_SECONDS: ${GEMINI_VISUAL_CRITIC_TIMEOUT_SECONDS:-60}
      GEMINI_REFERENCE_ANALYZER_MODEL: ${GEMINI_REFERENCE_ANALYZER_MODEL:-gemini-3.6-flash}
      GEMINI_REFERENCE_ANALYZER_THINKING_LEVEL: ${GEMINI_REFERENCE_ANALYZER_THINKING_LEVEL:-high}
      KAIGO_REFERENCE_MAX_PAGES: ${KAIGO_REFERENCE_MAX_PAGES:-1}
      KAIGO_REFERENCE_MAX_DEPTH: ${KAIGO_REFERENCE_MAX_DEPTH:-0}
      KAIGO_REFERENCE_TIMEOUT_SECONDS: ${KAIGO_REFERENCE_TIMEOUT_SECONDS:-600}
      KAIGO_REFERENCE_PAGE_TIMEOUT_SECONDS: ${KAIGO_REFERENCE_PAGE_TIMEOUT_SECONDS:-45}
      KAIGO_REFERENCE_MAX_TOTAL_BYTES: ${KAIGO_REFERENCE_MAX_TOTAL_BYTES:-104857600}
      KAIGO_REFERENCE_MAX_PAGE_BYTES: ${KAIGO_REFERENCE_MAX_PAGE_BYTES:-26214400}
      KAIGO_REFERENCE_MAX_RETRIES: ${KAIGO_REFERENCE_MAX_RETRIES:-1}
      KAIGO_REFERENCE_MAX_SCROLL_STEPS: ${KAIGO_REFERENCE_MAX_SCROLL_STEPS:-40}
      KAIGO_REFERENCE_SCROLL_DELAY_MS: ${KAIGO_REFERENCE_SCROLL_DELAY_MS:-750}
      KAIGO_REFERENCE_WARMUP_MS: ${KAIGO_REFERENCE_WARMUP_MS:-5000}
      KAIGO_REFERENCE_FINAL_SETTLE_MS: ${KAIGO_REFERENCE_FINAL_SETTLE_MS:-1500}
      KAIGO_REFERENCE_MAX_SCROLL_HEIGHT: ${KAIGO_REFERENCE_MAX_SCROLL_HEIGHT:-50000}
      KAIGO_REFERENCE_TRACE_TTL_SECONDS: ${KAIGO_REFERENCE_TRACE_TTL_SECONDS:-3600}
      KAIGO_REFERENCE_RESPECT_ROBOTS: ${KAIGO_REFERENCE_RESPECT_ROBOTS:-true}
      CRAWLEE_MEMORY_MBYTES: ${CRAWLEE_MEMORY_MBYTES:-4096}
      CRAWLEE_DISABLE_BROWSER_SANDBOX: "true"
      KAIGO_BROWSER_AUDIT_TIMEOUT_MS: ${KAIGO_BROWSER_AUDIT_TIMEOUT_MS:-10000}
      KAIGO_BROWSER_AUDIT_TOTAL_TIMEOUT_SECONDS: ${KAIGO_BROWSER_AUDIT_TOTAL_TIMEOUT_SECONDS:-120}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
      GEMINI_CHAT_THINKING_LEVEL: ${GEMINI_CHAT_THINKING_LEVEL:-medium}
      GEMINI_CHAT_TIMEOUT_SECONDS: ${GEMINI_CHAT_TIMEOUT_SECONDS:-45}
      KAIGO_BUILDER_DEFAULT_ENGINE: ${KAIGO_BUILDER_DEFAULT_ENGINE:-direct}
      KAIGO_BUILDER_ENABLE_ANTIGRAVITY: ${KAIGO_BUILDER_ENABLE_ANTIGRAVITY:-true}
      KAIGO_BUILDER_RUN_TTL_SECONDS: ${KAIGO_BUILDER_RUN_TTL_SECONDS:-3600}
      KAIGO_BUILDER_MAX_RUNS: ${KAIGO_BUILDER_MAX_RUNS:-100}
      GEMINI_ANTIGRAVITY_AGENT: ${GEMINI_ANTIGRAVITY_AGENT:-antigravity-preview-05-2026}
      GEMINI_ANTIGRAVITY_TIMEOUT_SECONDS: ${GEMINI_ANTIGRAVITY_TIMEOUT_SECONDS:-900}
      GEMINI_ANTIGRAVITY_MAX_SNAPSHOT_BYTES: ${GEMINI_ANTIGRAVITY_MAX_SNAPSHOT_BYTES:-10485760}
      GEMINI_ANTIGRAVITY_MAX_TOTAL_TOKENS: ${GEMINI_ANTIGRAVITY_MAX_TOTAL_TOKENS:-500000}
      GEMINI_INPUT_PRICE_MICROUSD_PER_MILLION: ${GEMINI_INPUT_PRICE_MICROUSD_PER_MILLION:-}
      GEMINI_OUTPUT_PRICE_MICROUSD_PER_MILLION: ${GEMINI_OUTPUT_PRICE_MICROUSD_PER_MILLION:-}
      KAIGO_BUILDER_EVIDENCE_DIR: /app/data/builder-evidence
    command: ["python", "scripts/run_builder_worker.py"]
    tmpfs:
      - /tmp:size=536870912,mode=1777
      - /app/data/builder-evidence:size=536870912,mode=0700,uid=10001,gid=10001
    networks:
      kaigo_builder_research:
        ipv4_address: 172.30.240.2
        gw_priority: 1
      kaigo_worker_db:
        ipv4_address: 172.30.242.3
    depends_on:
      db:
        condition: service_healthy

  migration:
    profiles:
      - operations
    image: ${KAIGO_APP_IMAGE:-ai_project-app:local}
    env_file:
      - path: .env
        required: false
    environment:
      KAIGO_ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://widget_admin:change-me@db:5432/widget_platform}
    command: ["python", "scripts/preflight_saas_schema.py"]
    restart: "no"
    networks:
      kaigo_app_db:
    depends_on:
      db:
        condition: service_healthy

  database-ops:
    profiles:
      - operations
    image: ${KAIGO_DATABASE_OPS_IMAGE:-postgres:15-alpine}
    env_file:
      - path: .env
        required: false
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-widget_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGDATABASE: ${POSTGRES_DB:-widget_platform}
    command: ["true"]
    restart: "no"
    volumes:
      - ${KAIGO_BACKUP_DIR:-./backups}:/backups
    networks:
      kaigo_app_db:
    depends_on:
      db:
        condition: service_healthy

  builder-lab:
    profiles:
      - builder-lab
    build:
      context: .
      dockerfile: Dockerfile.builder-lab
    image: ai_project-builder-lab
    container_name: ai_project_builder_lab
    restart: "no"
    init: true
    shm_size: 1gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_AI_NATIVE_BASE_URL: ${GOOGLE_AI_NATIVE_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_BUILDER_MODEL: ${GEMINI_BUILDER_MODEL:-gemini-3.6-flash}
      GEMINI_BUILDER_THINKING_LEVEL: ${GEMINI_BUILDER_THINKING_LEVEL:-high}
      GEMINI_BUILDER_TEMPERATURE: ${GEMINI_BUILDER_TEMPERATURE:-0.9}
      GEMINI_BUILDER_MAX_REPAIRS: ${GEMINI_BUILDER_MAX_REPAIRS:-3}
      GEMINI_VISUAL_CRITIC_MODEL: ${GEMINI_VISUAL_CRITIC_MODEL:-gemini-3.6-flash}
      GEMINI_VISUAL_CRITIC_THINKING_LEVEL: ${GEMINI_VISUAL_CRITIC_THINKING_LEVEL:-high}
      GEMINI_VISUAL_CRITIC_TIMEOUT_SECONDS: ${GEMINI_VISUAL_CRITIC_TIMEOUT_SECONDS:-60}
      GEMINI_REFERENCE_ANALYZER_MODEL: ${GEMINI_REFERENCE_ANALYZER_MODEL:-gemini-3.6-flash}
      GEMINI_REFERENCE_ANALYZER_THINKING_LEVEL: ${GEMINI_REFERENCE_ANALYZER_THINKING_LEVEL:-high}
      KAIGO_REFERENCE_MAX_PAGES: "1"
      KAIGO_REFERENCE_MAX_DEPTH: "0"
      KAIGO_REFERENCE_TIMEOUT_SECONDS: ${KAIGO_REFERENCE_TIMEOUT_SECONDS:-600}
      KAIGO_REFERENCE_PAGE_TIMEOUT_SECONDS: ${KAIGO_REFERENCE_PAGE_TIMEOUT_SECONDS:-45}
      KAIGO_REFERENCE_MAX_TOTAL_BYTES: ${KAIGO_REFERENCE_MAX_TOTAL_BYTES:-104857600}
      KAIGO_REFERENCE_MAX_PAGE_BYTES: ${KAIGO_REFERENCE_MAX_PAGE_BYTES:-26214400}
      KAIGO_REFERENCE_MAX_RETRIES: ${KAIGO_REFERENCE_MAX_RETRIES:-1}
      KAIGO_REFERENCE_MAX_SCROLL_STEPS: ${KAIGO_REFERENCE_MAX_SCROLL_STEPS:-40}
      KAIGO_REFERENCE_SCROLL_DELAY_MS: ${KAIGO_REFERENCE_SCROLL_DELAY_MS:-750}
      KAIGO_REFERENCE_WARMUP_MS: ${KAIGO_REFERENCE_WARMUP_MS:-5000}
      KAIGO_REFERENCE_FINAL_SETTLE_MS: ${KAIGO_REFERENCE_FINAL_SETTLE_MS:-1500}
      KAIGO_REFERENCE_MAX_SCROLL_HEIGHT: ${KAIGO_REFERENCE_MAX_SCROLL_HEIGHT:-50000}
      KAIGO_REFERENCE_TRACE_TTL_SECONDS: ${KAIGO_REFERENCE_TRACE_TTL_SECONDS:-3600}
      KAIGO_REFERENCE_RESPECT_ROBOTS: ${KAIGO_REFERENCE_RESPECT_ROBOTS:-true}
      CRAWLEE_MEMORY_MBYTES: ${CRAWLEE_MEMORY_MBYTES:-4096}
      CRAWLEE_DISABLE_BROWSER_SANDBOX: "true"
      KAIGO_BROWSER_AUDIT_TIMEOUT_MS: ${KAIGO_BROWSER_AUDIT_TIMEOUT_MS:-10000}
      KAIGO_BROWSER_AUDIT_TOTAL_TIMEOUT_SECONDS: ${KAIGO_BROWSER_AUDIT_TOTAL_TIMEOUT_SECONDS:-120}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
      GEMINI_CHAT_THINKING_LEVEL: ${GEMINI_CHAT_THINKING_LEVEL:-medium}
      GEMINI_CHAT_TIMEOUT_SECONDS: ${GEMINI_CHAT_TIMEOUT_SECONDS:-45}
      KAIGO_CHAT_SESSION_SECRET: ${KAIGO_CHAT_SESSION_SECRET:-}
      KAIGO_CHAT_SESSION_TTL_SECONDS: ${KAIGO_CHAT_SESSION_TTL_SECONDS:-3600}
      KAIGO_CHAT_MAX_SESSIONS: ${KAIGO_CHAT_MAX_SESSIONS:-500}
      KAIGO_CHAT_RATE_LIMIT_REQUESTS: ${KAIGO_CHAT_RATE_LIMIT_REQUESTS:-12}
      KAIGO_CHAT_IP_RATE_LIMIT_REQUESTS: ${KAIGO_CHAT_IP_RATE_LIMIT_REQUESTS:-60}
      KAIGO_CHAT_RATE_LIMIT_WINDOW_SECONDS: ${KAIGO_CHAT_RATE_LIMIT_WINDOW_SECONDS:-60}
      KAIGO_CHAT_MAX_REQUESTS_PER_SESSION: ${KAIGO_CHAT_MAX_REQUESTS_PER_SESSION:-40}
      KAIGO_CHAT_GLOBAL_CONCURRENCY: ${KAIGO_CHAT_GLOBAL_CONCURRENCY:-4}
      KAIGO_CHAT_SECURE_COOKIE: ${KAIGO_CHAT_SECURE_COOKIE:-true}
      KAIGO_BUILDER_DEFAULT_ENGINE: ${KAIGO_BUILDER_DEFAULT_ENGINE:-direct}
      GEMINI_ANTIGRAVITY_AGENT: ${GEMINI_ANTIGRAVITY_AGENT:-antigravity-preview-05-2026}
      GEMINI_ANTIGRAVITY_TIMEOUT_SECONDS: ${GEMINI_ANTIGRAVITY_TIMEOUT_SECONDS:-900}
      GEMINI_ANTIGRAVITY_MAX_SNAPSHOT_BYTES: ${GEMINI_ANTIGRAVITY_MAX_SNAPSHOT_BYTES:-10485760}
      GEMINI_ANTIGRAVITY_MAX_TOTAL_TOKENS: ${GEMINI_ANTIGRAVITY_MAX_TOTAL_TOKENS:-500000}
      KAIGO_BUILDER_ENABLE_ANTIGRAVITY: ${KAIGO_BUILDER_ENABLE_ANTIGRAVITY:-true}
      KAIGO_BUILDER_RUN_TTL_SECONDS: ${KAIGO_BUILDER_RUN_TTL_SECONDS:-3600}
      KAIGO_BUILDER_MAX_RUNS: ${KAIGO_BUILDER_MAX_RUNS:-100}
      KAIGO_BUILDER_LAB_HOST: 0.0.0.0
      KAIGO_BUILDER_LAB_PORT: 8091
      KAIGO_BUILDER_LAB_ALLOW_REMOTE: "true"
      KAIGO_BUILDER_DEMO_PATH: /app/data/builder-demo/latest.json
      KAIGO_BUILDER_DEMO_DIR: ${KAIGO_BUILDER_DEMO_DIR:-/app/data/builder-demo/direct-abc-v1}
    command: ["python", "scripts/run_builder_lab.py"]
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ./data/builder-demo:/app/data/builder-demo
    networks:
      kaigo_builder_research:
        ipv4_address: 172.30.240.4
        gw_priority: 1
    dns:
      - 1.1.1.1
      - 8.8.8.8

  db:
    image: postgres:15-alpine
    container_name: ai_project_db
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      kaigo_app_db:
      kaigo_worker_db:
        ipv4_address: 172.30.242.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  kaigo_app_public:
    name: kaigo_app_public
    driver: bridge
  kaigo_app_db:
    name: kaigo_app_db
    driver: bridge
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.241.0/28
  kaigo_worker_db:
    name: kaigo_worker_db
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-kaigo-wdb
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.242.0/28
          gateway: 172.30.242.1
  kaigo_builder_research:
    name: kaigo_builder_research
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-kaigo-build
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.240.0/28
