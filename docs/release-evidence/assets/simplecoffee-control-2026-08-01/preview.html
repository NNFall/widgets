igo-widget__badge { background: #FFD200; color: #111111; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 9999px; text-transform: uppercase; } .kaigo-widget__status { display: inline-flex; align-items: center; gap: 6px; background: #D7EEDD; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; color: #1E4D2B; width: fit-content; } .kaigo-widget__status-dot { width: 6px; height: 6px; border-radius: 50%; background-color: #2E7D32; animation: kaigo-status-pulse 2s infinite ease-in-out; } @keyframes kaigo-status-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } } .kaigo-widget__close-btn { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; background: transparent; border: none; border-radius: 50%; color: #666666; cursor: pointer; transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); min-width: 44px; min-height: 44px; flex-shrink: 0; } .kaigo-widget__close-btn:hover { background: #F4F1EA; color: #222222; transform: rotate(90deg); } .kaigo-widget__messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #FAF8F5; min-height: 100px; max-height: 320px; } .kaigo-widget__messages::-webkit-scrollbar { width: 4px; } .kaigo-widget__messages::-webkit-scrollbar-thumb { background: #E0DDD7; border-radius: 4px; } .kaigo-widget__message, .kaigo-widget [data-kaigo-runtime-message] { display: flex; flex-direction: column; max-width: 85%; word-break: break-word; transition: transform 0.2s ease; } .kaigo-widget__message--assistant, .kaigo-widget [data-kaigo-runtime-message="assistant"] { align-self: flex-start; } .kaigo-widget__message--user, .kaigo-widget [data-kaigo-runtime-message="user"] { align-self: flex-end; } .kaigo-widget__message-label, .kaigo-widget [data-kaigo-runtime-label] { font-size: 11px; font-weight: 700; text-transform: lowercase; colo  6px 0; } .kaigo-widget [data-kaigo-runtime-retry="true"] { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; padding: 0 16px; background: #E55325; color: #FFFFFF; border: none; border-radius: 9999px; font-size: 12px; font-weight: 700; cursor: pointer; transition: background-color 0.2s ease, transform 0.2s ease; } .kaigo-widget [data-kaigo-runtime-retry="true"]:hover { background: #d4471e; transform: scale(1.03); } .kaigo-widget:has([data-kaigo-runtime-message="user"]) [data-region="suggestions"], .kaigo-widget:has([data-kaigo-runtime-status="error"]) [data-region="suggestions"] { display: none !important; } .kaigo-widget__suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; background: #FAF8F5; border-top: 1px solid #F0ECE6; } .kaigo-widget__suggestion-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; padding: 8px 16px; background: #FFFFFF; border: 1.5px solid #E55325; color: #E55325; border-radius: 9999px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease; text-align: center; line-height: 1.2; } .kaigo-widget__suggestion-btn:hover { background: #E55325; color: #FFFFFF; transform: translateY(-2px) scale(1.02); box-shadow: 0 4px 12px rgba(229, 83, 37, 0.25); } .kaigo-widget__suggestion-btn:active { transform: translateY(0) scale(0.98); } .kaigo-widget__composer { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: #FFFFFF; border-top: 1px solid #F0ECE6; } .kaigo-widget__input { flex: 1; border: 1px solid #E2DDD5; border-radius: 20px; padding: 10px 14px; font-size: 14px; font-family: inherit; color: #222222; background: #FAF8F5; resize: none; outline: none; height: 44px; max-height: 100px; line-height: 1.4; transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow     [data-region="root"] [hidden] { display: none !important; }

und"/></svg></div><div class="kaigo-widget__header-text"><div class="kaigo-widget__title-row"><h2 class="kaigo-widget__title">simple barista</h2><span class="kaigo-widget__badge">AI</span></div><div class="kaigo-widget__status"><span class="kaigo-widget__status-dot"></span><span class="kaigo-widget__status-text">на связи • завтраки до 14:00</span></div></div></div><button class="kaigo-widget__close-btn" data-action="close" aria-label="Закрыть чат"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18"/><path d="M6 6L18 18"/></svg></button></header><div class="kaigo-widget__messages" data-region="messages"><div class="kaigo-widget__message kaigo-widget__message--assistant"><span class="kaigo-widget__message-label">simple barista</span><div class="kaigo-widget__message-content">Привет! Я помогу выбрать кофе, рассказать про свежие завтраки и комбо-обеды за 400 ₽.</div></div></div><div class="kaigo-widget__suggestions" data-region="suggestions"><button class="kaigo-widget__suggestion-btn" data-action="suggestion" data-suggestion="Про комбо за 400 ₽">Про комбо за 400 ₽</button><button class="kaigo-widget__suggestion-btn" data-action="suggestion" data-suggestion="Завтраки до 14:00">Завтраки до 14:00</button></div><div class="kaigo-widget__composer" data-region="composer" aria-label="Форма отправки сообщения"><textarea class="kaigo-widget__input" rows="1" placeholder="Задайте вопрос о меню..." aria-label="Задайте вопрос бариста"></textarea><button class="kaigo-widget__send-btn" data-action="send" aria-label="Отправить сообщение"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg></button></div></div></div>
<script>
(() => {
  'use strict';
  const channelId = "kaigo-public-simplecoffee-v1";
  const revision = 5;
  const root = document.querySelector('[data-region="root"]');
  const assistantLabel = String(
    (root && (root.dataset.assistantLabel || root.getAttribute('aria-label')))
    || 'AI-КОНСУЛЬТАНТ'
  ).trim().slice(0, 80) || 'AI-КОНСУЛЬТАНТ';
  const launcher = document.querySelector('[data-region="launcher"]');
  const panel = document.querySelector('[data-region="panel"]');
  const composer = document.querySelector('[data-region="composer"]');
  const messages = document.querySelector('[data-region="messages"]');
  const suggestionsRegion = document.querySelector('[data-region="suggestions"]');
  const suggestions = Array.from(document.querySelectorAll('[data-suggestion], [data-region="suggestions"] button'));
  let input = composer && composer.querySelector('input, textarea');
  const toggle = root && root.querySelector('.kaigo-toggle, [data-action="toggle"], input[type="checkbox"]');
  const requestPattern = /^[A-Za-z0-9][A-Za-z0-9._-]{7,95}$/;
  const ATTENTION_DELAY_MS = 15000;
  const reducedMotionQuery = matchMedia('(prefers-reduced-motion: reduce)');
  let pendingRequest = null;
  let failedRequest = null;
  let attentionTimer = null;
  let attentionCancelled = false;

  if (input && input.tagName !== 'TEXTAREA') {
    const replacement = document.createElement('textarea');
    replacement.className = input.className;
    replacement.placeholder = input.placeholder || '';
    replacement.setAttribute('aria-label', input.getAttribute('aria-label') || 'Введите сообщение');
    replacement.autocomplete = 'off';
    input.replaceWith(replacement);
    input = replacement;
  }
  if (input) {
    input.rows = 1;
    input.setAttribute('data-kaigo-runtime-input', 'true');
  }
  if (messages) {
    messages.setAttribute('role', 'log');
    messages.setAttribute('aria-live', 'polite');
    messages.setAttribute('aria-relevant', 'additions');
  }

  function cancelAttention() {
    if (attentionCancelled) return;
    attentionCancelled = true;
    if (attentionTimer !== null) clearTimeout(attentionTimer);
    attentionTimer = null;
    if (root) root.classList.remove('kaigo-preview-attention');
  }

  function scheduleAttention() {
    if (
      !root
      || attentionCancelled
      || attentionTimer !== null
      || document.visibilityState !== 'visible'
      || root.dataset.state !== 'closed'
      || root.dataset.chatStarted === 'true'
      || reducedMotionQuery.matches
    ) return;
    attentionTimer = setTimeout(() => {
      attentionTimer = null;
      if (
        attentionCancelled
        || document.visibilityState !== 'visible'
        || root.dataset.state !== 'closed'
        || root.dataset.chatStarted === 'true'
        || reducedMotionQuery.matches
      ) return;
      root.classList.add('kaigo-preview-attention');
    }, ATTENTION_DELAY_MS);
  }

  const setOpen = (open, returnFocus = false) => {
    if (!root) return;
    if (open) cancelAttention();
    root.classList.toggle('kaigo-preview-open', Boolean(open));
    root.dataset.state = open ? 'open' : 'closed';
    if (panel) panel.toggleAttribute('data-open', Boolean(open));
    if (toggle) toggle.checked = Boolean(open);
    if (launcher) {
      launcher.hidden = Boolean(open);
      launcher.setAttribute('aria-hidden', open ? 'true' : 'false');
      launcher.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    if (panel) panel.setAttribute('aria-hidden', open ? 'false' : 'true');
    if (open && input && matchMedia('(hover: hover) and (pointer: fine)').matches) {
      setTimeout(() => input.focus(), 0);
    }
    if (!open && returnFocus && launcher && document.activeElement !== launcher) launcher.focus();
  };

  if (launcher) launcher.addEventListener('click', (event) => {
    if (toggle && event.target === toggle) return;
    event.preventDefault();
    const opening = !root || root.dataset.state !== 'open';
    setOpen(opening, !opening);
  });

  if (toggle) toggle.addEventListener('change', () => setOpen(toggle.checked));

  const closeButton = document.querySelector('[data-action="close"]');
  if (closeButton) closeButton.addEventListener('click', (event) => {
    event.preventDefault();
    setOpen(false, true);
  });

  function appendMessage(role, text) {
    if (!messages) return;
    const message = document.createElement('article');
    message.className = `kaigo-widget__message kaigo-widget__message--${role}`;
    message.setAttribute('data-kaigo-runtime-message', role);
    const label = document.createElement('span');
    label.className = 'kaigo-widget__message-label';
    label.setAttribute('data-kaigo-runtime-label', role);
    label.textContent = role === 'user' ? 'ВЫ' : assistantLabel;
    const content = document.createElement('p');
    content.className = 'kaigo-widget__message-content';
    content.setAttribute('data-kaigo-runtime-content', role);
    content.textContent = text;
    message.append(label, content);
    messages.append(message);
    messages.scrollTop = messages.scrollHeight;
  }

  function clearStatus() {
    const status = messages && messages.querySelector('[data-kaigo-runtime-status]');
    if (status) status.remove();
  }

  function showStatus(kind, text, retryable = false) {
    if (!messages) return;
    clearStatus();
    const status = document.createElement('div');
    status.className = `kaigo-widget__message-status kaigo-widget__message-status--${kind}`;
    status.setAttribute('data-kaigo-runtime-status', kind);
    status.setAttribute('role', kind === 'error' ? 'alert' : 'status');
    const copy = document.createElement('span');
    copy.textContent = text;
    status.append(copy);
    if (retryable) {
      const retry = document.createElement('button');
      retry.type = 'button';
      retry.setAttribute('data-kaigo-runtime-retry', 'true');
      retry.textContent = 'ПОВТОРИТЬ';
      retry.addEventListener('click', retryFailedRequest);
      status.append(retry);
    }
    messages.append(status);
    messages.scrollTop = messages.scrollHeight;
  }

  function setBusy(value) {
    if (!composer) return;
    composer.setAttribute('aria-busy', value ? 'true' : 'false');
    const send = composer.querySelector('[data-action="send"], button');
    if (send) send.disabled = Boolean(value);
  }

  function requestId() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return 'request-' + Array.from(crypto.getRandomValues(new Uint8Array(12)), value => value.toString(16).padStart(2, '0')).join('');
  }

  function postPendingRequest() {
    if (!pendingRequest) return;
    clearStatus();
    setBusy(true);
    showStatus('pending', 'Gemini готовит ответ');
    window.parent.postMessage({
      source: 'kaigo-builder-preview',
      version: 2,
      channel_id: channelId,
      type: 'chat.request',
      request_id: pendingRequest.requestId,
      revision,
      text: pendingRequest.text
    }, '*');
  }

  function retryFailedRequest() {
    if (!failedRequest || pendingRequest) return;
    pendingRequest = failedRequest;
    failedRequest = null;
    postPendingRequest();
  }

  function sendText(text) {
    const normalized = String(text || '').trim();
    if (!normalized || normalized.length > 1000 || pendingRequest) return;
    cancelAttention();
    failedRequest = null;
    clearStatus();
    if (root) root.dataset.chatStarted = 'true';
    if (suggestionsRegion) {
      suggestionsRegion.hidden = true;
      suggestionsRegion.setAttribute('aria-hidden', 'true');
    }
    suggestions.forEach(item => { item.disabled = true; });
    pendingRequest = { requestId: requestId(), text: normalized };
    appendMessage('user', normalized);
    postPendingRequest();
  }

  suggestions.slice(2).forEach(item => { item.hidden = true; item.disabled = true; });
  suggestions.slice(0, 2).forEach(suggestion => suggestion.addEventListener('click', event => {
    event.preventDefault();
    const text = suggestion.dataset.suggestion || suggestion.textContent.trim();
    sendText(text);
  }));

  if (composer) composer.addEventListener('click', event => {
    const button = event.target.closest('[data-action="send"], button');
    if (!button || button.hasAttribute('data-kaigo-runtime-retry') || !input) return;
    event.preventDefault();
    sendText(input.value);
  });

  function autosize() {
    if (!input) return;
    input.style.height = 'auto';
    const lineHeight = parseFloat(getComputedStyle(input).lineHeight) || 20;
    const minHeight = Math.max(44, lineHeight + 8);
    const maxHeight = lineHeight * 4 + 8;
    input.style.height = `${Math.max(minHeight, Math.min(input.scrollHeight, maxHeight))}px`;
    input.style.overflowY = input.scrollHeight > maxHeight ? 'auto' : 'hidden';
  }
  if (input) {
    input.addEventListener('input', autosize);
    input.addEventListener('keydown', event => {
      if (event.isComposing) return;
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendText(input.value);
      }
    });
    autosize();
  }

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && root && root.dataset.state === 'open') {
      event.preventDefault();
      setOpen(false, true);
      if (launcher) launcher.focus();
    }
  });

  window.addEventListener('message', (event) => {
    const data = event.data;
    if (event.source !== window.parent || !data || data.source !== 'kaigo-builder-parent' || data.version !== 2 || data.channel_id !== channelId || data.revision !== revision) return;
    if (data.type === 'set-open') { setOpen(Boolean(data.open)); return; }
    if (!pendingRequest || !requestPattern.test(data.request_id) || data.request_id !== pendingRequest.requestId) return;
    if (data.type === 'chat.response') {
      if (typeof data.text !== 'string' || !data.text.trim() || data.text.length > 4000) return;
      clearStatus();
      appendMessage('assistant', data.text.trim());
      if (input && input.value === pendingRequest.text) input.value = '';
      pendingRequest = null;
      setBusy(false);
      autosize();
      return;
    }
    if (data.type === 'chat.error') {
      failedRequest = pendingRequest;
      pendingRequest = null;
      clearStatus();
      setBusy(false);
      showStatus('error', typeof data.message === 'string' ? data.message.slice(0, 320) : 'Связь прервалась. Текст сохранён.', data.retryable !== false);
    }
  });

  document.addEventListener('pointerdown', cancelAttention, {capture: true, once: true});
  document.addEventListener('keydown', cancelAttention, {capture: true, once: true});
  document.addEventListener('visibilitychange', cancelAttention, {once: true});
  reducedMotionQuery.addEventListener('change', event => {
    if (event.matches) cancelAttention();
  });
  setOpen(false);
  scheduleAttention();
  window.parent.postMessage({
    source: 'kaigo-builder-preview',
    version: 2,
    channel_id: channelId,
    type: 'rendered',
    revision
  }, '*');
})();
</script>

</body>
</html>
