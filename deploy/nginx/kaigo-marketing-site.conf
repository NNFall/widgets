# Location contract for the existing `server` block serving kaigo.space.
#
# Integration boundary:
# - keep every existing exact/prefix location not repeated here (for example
#   /real-time/, /builder-demo/, /builder-comparison/ and certificate routes);
# - replace the existing `location /` fallback and the existing `/builder/`
#   location with the blocks below;
# - the static release symlink is managed by scripts/deploy_marketing_site.sh.

location = / {
    root /var/www/kaigo-marketing/current;
    try_files /index.html =404;

    add_header Cache-Control "no-store";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

location = /favicon.svg {
    root /var/www/kaigo-marketing/current;
    try_files /favicon.svg =404;

    access_log off;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
}

location = /studio {
    root /var/www/kaigo-marketing/current;
    try_files /index.html =404;

    add_header Cache-Control "no-store";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

location = /studio/ {
    root /var/www/kaigo-marketing/current;
    try_files /index.html =404;

    add_header Cache-Control "no-store";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

location ~* "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(css|js|woff2?|png|jpe?g|webp|svg)$" {
    root /var/www/kaigo-marketing/current;
    try_files $uri =404;

    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location /assets/ {
    root /var/www/kaigo-marketing/current;
    try_files $uri =404;

    access_log off;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /builder {
    auth_basic "Kaigo Builder";
    auth_basic_user_file /etc/nginx/.htpasswd-kaigo-builder;
    return 308 /builder/;
}

location ^~ /builder/ {
    auth_basic "Kaigo Builder";
    auth_basic_user_file /etc/nginx/.htpasswd-kaigo-builder;

    proxy_pass http://127.0.0.1:8091/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
}

# YooKassa sends public notifications here. The application does not trust
# the notification body: it fetches the payment from YooKassa before granting
# entitlement. Keep this exact public callback route narrow.
location = /api/billing/webhooks/yookassa {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_read_timeout 30s;
}

# Studio generation progress uses SSE under /api/. Keep buffering and caching
# disabled for the whole API prefix so event frames are delivered immediately.
location ^~ /api/ {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    add_header X-Accel-Buffering "no" always;
}

# Stable public widget loader and runtime routes remain outside both Studio and
# Builder Basic Auth.
location ~ ^/embed/[A-Za-z0-9_-]+\.js$ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
}

location ^~ /runtime/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}

location ^~ /billing/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
}

# Existing routes such as /w/, /client/ and /admin/ continue to reach the
# original application. More-specific locations kept in the server block still
# win over this fallback.
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
