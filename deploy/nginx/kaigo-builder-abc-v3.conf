location = /builder-comparison/direct-abc-v3 {
    return 301 /builder-comparison/direct-abc-v3/;
}

location ^~ /builder-comparison/direct-abc-v3/ {
    alias /var/www/kaigo-builder-comparison/direct-abc-v3/;
    index index.html;
    add_header Cache-Control "no-store";
}

location = /builder-comparison/direct-abc-v3/product-chat {
    proxy_pass http://127.0.0.1:8091/demos/product-chat;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /builder-comparison/direct-abc-v3/product-chat/preview {
    proxy_pass http://127.0.0.1:8091/demos/product-chat/preview;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /builder-comparison/direct-abc-v3/product-chat/chat {
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8091/demos/product-chat/chat;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 60s;
}

