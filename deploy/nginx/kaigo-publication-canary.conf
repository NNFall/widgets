# Static, credential-free publication acceptance origins.
# TLS certificates are provisioned and renewed by the operator outside Git.

server {
    listen 80;
    server_name canary.kaigo.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name canary.kaigo.space;

    ssl_certificate /etc/letsencrypt/live/canary.kaigo.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canary.kaigo.space/privkey.pem;
    root /var/www/kaigo-publication-canary;

    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; script-src 'self' https://kaigo.space; frame-src https://kaigo.space; connect-src https://kaigo.space; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

    location = / {
        try_files /index.html =404;
    }

    location = /canary.js {
        try_files /canary.js =404;
    }
}

server {
    listen 80;
    server_name denied-canary.kaigo.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name denied-canary.kaigo.space;

    ssl_certificate /etc/letsencrypt/live/denied-canary.kaigo.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/denied-canary.kaigo.space/privkey.pem;
    root /var/www/kaigo-publication-canary;

    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; script-src 'self' https://kaigo.space; frame-src https://kaigo.space; connect-src https://kaigo.space; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

    location = / {
        try_files /index.html =404;
    }

    location = /canary.js {
        try_files /canary.js =404;
    }
}
