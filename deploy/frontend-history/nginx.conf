# Immutable UI history served under the existing kaigo.space HTTPS server.
# The current marketing root and /studio locations remain unchanged.

location = /frontend {
    return 308 /frontend/;
}

location ^~ /frontend-preview-api/ {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:18110/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_redirect /api/ /frontend-preview-api/api/;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
    add_header X-Accel-Buffering "no" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location ^~ /frontend/ {
    alias /var/www/kaigo-frontend-history/current/;
    index index.html;
    autoindex off;

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self'; form-action 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
}
