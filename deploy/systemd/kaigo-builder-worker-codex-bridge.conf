[Unit]
Requires=kaigo-codex-bridge.service
After=kaigo-codex-bridge.service

[Service]
Environment=KAIGO_CODEX_BRIDGE_ENABLED=true
Environment=KAIGO_CODEX_BRIDGE_SOCKET_PATH=/run/kaigo-codex/bridge.sock
Environment=KAIGO_CODEX_BRIDGE_SOCKET_DIR=/run/kaigo-codex
Environment=KAIGO_CODEX_BRIDGE_TIMEOUT_SECONDS=900
Environment=KAIGO_CODEX_BRIDGE_MODEL=gpt-5.6-luna
Environment=KAIGO_CODEX_BRIDGE_VISUAL_JUDGE_MODEL=gpt-5.6-sol
